services:
  - type: web
    name: erp-uae-api
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm run seed && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DB_PATH
        value: backend/data/erp.db
      - key: DEMO_PASSWORD
        generateValue: true
      - key: SESSION_HOURS
        value: "12"
