<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فاتورة ضريبية</title>
  <link rel="stylesheet" href="css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; margin: 0; background: #eef1f4; color: #222; }
    .sheet { max-width: 820px; margin: 1.5rem auto; background: #fff; padding: 2rem 2.5rem; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
    .head { display: flex; justify-content: space-between; border-bottom: 3px solid #2c3e50; padding-bottom: 1rem; margin-bottom: 1rem; }
    h1 { margin: 0; font-size: 1.5rem; } .en { direction: ltr; color: #555; font-size: .9rem; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem 2rem; margin: 1rem 0; font-size: .92rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .9rem; } th, td { border: 1px solid #cfd6dc; padding: .45rem .6rem; text-align: right; } th { background: #f1f4f7; }
    td.n, th.n { text-align: left; direction: ltr; }
    .tot { margin: 1rem 0 0 auto; width: 320px; } .tot div { display: flex; justify-content: space-between; padding: .25rem 0; } .tot .g { border-top: 2px solid #2c3e50; font-weight: 800; font-size: 1.1rem; }
    .foot { margin-top: 2rem; font-size: .8rem; color: #555; border-top: 1px dashed #aaa; padding-top: .6rem; }
    .bar { text-align: center; margin: 1rem; } @media print { body { background: #fff; } .sheet { box-shadow: none; margin: 0; max-width: none; } .bar { display: none; } }
  </style>
</head>
<body>
  <div class="bar"><button class="btn btn-primary" id="print">طباعة</button> <a class="btn btn-outline" href="sales.html">رجوع</a></div>
  <div class="sheet" id="sheet"><p style="text-align:center">جارٍ التحميل...</p></div>
  <script src="js/fmt.js"></script><script src="js/api.js"></script><script src="js/pages/sale-print.js"></script>
</body>
</html>
