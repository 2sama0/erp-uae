<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - نظام إدارة معرض السيارات</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <nav class="navbar auth-nav"><div class="nav-container">
    <div class="nav-brand"><a href="index.html" class="logo"><i class="fas fa-car"></i><span>CarDealer ERP</span></a></div>
  </div></nav>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header"><h1 class="auth-title">تسجيل الدخول</h1><p class="auth-subtitle">أدخل بيانات الدخول للوصول إلى النظام</p></div>
      <form id="loginForm" class="auth-form" novalidate>
        <div id="loginError" class="alert alert-error" style="display:none" role="alert"></div>
        <div class="form-group">
          <label for="username" class="form-label"><i class="fas fa-user"></i> اسم المستخدم</label>
          <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password" class="form-label"><i class="fas fa-lock"></i> كلمة المرور</label>
          <div class="password-container">
            <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="togglePassword" aria-label="إظهار كلمة المرور"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
        <p style="text-align:center;margin-top:1rem;font-size:.85rem;color:#7f8c8d">لإنشاء حساب جديد تواصل مع مدير النظام.</p>
      </form>
      <div class="auth-footer"><a href="index.html" class="back-home"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a></div>
    </div>
  </div>
  <script src="js/fmt.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
